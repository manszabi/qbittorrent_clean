# A program telepites nelkul is fut (nincs kulso fuggosege), ez a fajl a
# fejlesztoi eszkozok - a ruff es a mypy - kozos beallitasa.

[project]
name = "qbittorrent-clean"
version = "2.2.0"
description = "A qBittorrentben mar nem szereplo fajlok kilistazasa es torlese"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade - a mai nyelvtan
    "B",    # bugbear
    "SIM",  # egyszerusitesek
    "C4",   # comprehension-ok
    "BLE",  # blind except
    "PL",   # pylint: tul hosszu / tul sok agu fuggveny, nyers szamok
    "RUF",
]
ignore = [
    # A kimenet magyar: az ekezetek es a gondolatjel szandekosak.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Az indito szandekosan regi nyelvtannal keszult, hogy egy tul regi Python is
# le tudja forditani, es ertheto uzenetet tudjon adni a verziorol. Ezert nem
# hasznal f-stringet - es a felulet importjat is szandekosan az ellenorzesek
# UTAN vegzi.
"indit.py" = ["UP031", "UP032", "RUF005", "PLC0415"]
# A tesztek egyetlen szkriptkent futnak, felulrol lefele: ott az import nem
# csak a fajl elejen all, a modulszintu allapot szandekos, a nyers szamok
# pedig eppen a vart ertekek.
"tests/*" = ["E402", "RUF005", "PLR2004", "PLW0603", "PLR0915", "PLC0415"]

# --- mypy: tipusellenorzes ---------------------------------------------------
# A ruff a nyelvtant es a stilust nezi, a mypy a tipusokat: azt fogja meg, amit
# a teszt csak akkor venne eszre, ha eppen arra az agra fut ra (elgepelt mezo,
# None-nal nem szamolo hivas, rossz visszateresi ertek).
[tool.mypy]
python_version = "3.10"
files = ["qbt_cleanup.py", "qbt_gui.py", "qbt_naplo.py", "qbt_kornyezet.py",
         "indit.py"]
strict = true
# Az uzenet mutassa meg a kodot is: igy latszik, mit kellene javitani, es
# melyik ellenorzest kapcsolna ki egy esetleges "type: ignore".
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# Az indito szandekosan regi nyelvtannal, tipus-annotaciok nelkul keszult:
# egy tul regi Pythonnak is le kell tudnia forditani, hogy ertheto uzenetet
# adhasson a verziorol. A tobbi ellenorzes (elgepelt nev, rossz hivas) ra is
# vonatkozik.
module = "indit"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# A tesztek szandekosan cserelgetik a program belsejet (hamis parbeszedablak,
# lassitott fuggveny, Windows-szimulacio) - ott a tipusellenorzes csak zajt
# adna, ezert a fenti "files" nem tartalmazza oket.
